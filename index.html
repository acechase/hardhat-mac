<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hardhat Mac">
<meta name="theme-color" content="#0a0c12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Hardhat Mac</title>
<style>
html { height: 100%; box-sizing: border-box; background: #0a0c12;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one screen, three bands. Site sign (HUD) on top, the playfield in the middle, a control deck below a strip of hazard tape. */
:root {
  color-scheme: dark;
  --night: #0a0c12;      /* blue-black site at night */
  --steel: #171c29;      /* deck and card surfaces */
  --steel-hi: #262e42;   /* raised controls */
  --chalk: #eef2f7;      /* text */
  --dim: #8d98ad;        /* secondary text */
  --hazard: #ffc928;     /* hard-hat yellow, the one loud colour */
  --girder: #ff7a2a;
  --sky: #2ab8ff;
  --go: #37e06a;
  --font-sign: "Silkscreen", "Courier New", monospace;
  --font-note: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--chalk);
  font-family: var(--font-note); font-size: 17px;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box;
  padding-inline: 0; padding-block: 4px 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.tools { display: flex; flex-direction: column; justify-content: center; gap: 8px; flex: 0 1 auto; min-width: 0; }
.tools button {
  font-family: var(--font-sign); font-size: 10px; color: var(--chalk);
  background: var(--steel); border: 1px solid var(--steel-hi); border-radius: 4px;
  padding: 8px 6px; min-width: 64px; min-height: 34px; touch-action: manipulation;
}
.tools button:focus-visible, .card button:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
.stage { flex: none; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; }
canvas { display: block; image-rendering: pixelated; background: #000; max-width: 100%; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(6, 8, 12, 0.78);
}
.card { width: min(100%, 320px); display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; padding: 16px; }
.card h1 { margin: 0; font-family: var(--font-sign); font-weight: 700; font-size: clamp(30px, 10vw, 44px); line-height: 0.95; color: var(--hazard); text-wrap: balance; text-shadow: 3px 3px 0 #000; }
.card h2 { margin: 0; font-family: var(--font-sign); font-weight: 400; font-size: 20px; color: var(--hazard); text-wrap: balance; }
.card .eyebrow { font-family: var(--font-sign); font-size: 11px; letter-spacing: 0.1em; color: var(--dim); }
.card p { margin: 0; font-size: 18px; line-height: 1.3; color: var(--chalk); }
.card p.small { font-size: 15px; color: var(--dim); }
.card button {
  font-family: var(--font-sign); font-size: 16px; color: #000; background: var(--hazard);
  border: 0; border-radius: 4px; padding: 14px 22px; box-shadow: 0 4px 0 #a37d00; touch-action: manipulation;
}
.card button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a37d00; }
.spacer { flex: 1 1 0; min-height: 0; margin-top: -8px; }
.tape { height: 8px; flex: none; margin-inline: 16px; border-radius: 2px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 10px, #111 10px 20px); }
.deck { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; height: clamp(124px, 22vh, 170px); margin-inline: 16px; touch-action: none; }
.dpad { position: relative; height: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--steel); border: 2px solid var(--steel-hi); touch-action: none; }
.dpad span { position: absolute; width: 30%; height: 30%; display: flex; align-items: center; justify-content: center; color: var(--dim); border-radius: 8px; background: var(--steel-hi); }
.dpad span::before { content: ""; border: 8px solid transparent; }
.dpad .u::before { border-bottom-color: currentColor; margin-top: -8px; }
.dpad .d::before { border-top-color: currentColor; margin-bottom: -8px; }
.dpad .l::before { border-right-color: currentColor; margin-left: -8px; }
.dpad .r::before { border-left-color: currentColor; margin-right: -8px; }
.dpad .u { left: 35%; top: 5%; } .dpad .d { left: 35%; bottom: 5%; }
.dpad .l { left: 5%; top: 35%; } .dpad .r { right: 5%; top: 35%; }
.dpad span.on { background: var(--hazard); color: #000; }
.jump {
  height: 78%; aspect-ratio: 1; border-radius: 50%; border: 0; touch-action: none;
  background: var(--girder); color: #000; font-family: var(--font-sign); font-size: 16px;
  box-shadow: 0 6px 0 #9c3f08;
}
.jump.on { transform: translateY(4px); box-shadow: 0 2px 0 #9c3f08; }
@media (min-width: 700px) and (min-height: 700px) { .deck { height: 150px; } }
@media (max-height: 560px) { .deck { height: 112px; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" width="256" height="320" aria-label="Game screen"></canvas>
    <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
  </div>
  <div class="spacer"></div>
  <div class="tape" aria-hidden="true"></div>
  <div class="deck">
    <div class="dpad" id="dpad" role="group" aria-label="Move">
      <span class="u" data-d="up"></span><span class="d" data-d="down"></span>
      <span class="l" data-d="left"></span><span class="r" data-d="right"></span>
    </div>
    <div class="tools">
      <button id="btnPause" type="button">PAUSE</button>
      <button id="btnSound" type="button" aria-pressed="true">SND ON</button>
      <button id="btnFull" type="button" hidden>FULL</button>
    </div>
    <button class="jump" id="jump" type="button">JUMP</button>
  </div>
</div>
<script>
"use strict";
/* ===== Game logic (no DOM) ===== */
const T = 16, COLS = 16, ROWS = 20, W = 256, H = 320;
const GRAV = 0.15, JUMP = -2.6, WALK = 1.3, CLIMB = 1.0, MAXFALL = 40, SPRINGV = -4.7, CONV = 0.5;
const SOLID = '=><^gG';

const LEVELS = [
  {
    name: 'Steel Frame',
    goal: 'Carry the 4 girders to the gaps. Then grab the jackhammer and rivet each one.',
    map: [
      '................', '................', '................',
      '====__==========',
      '................', '................', '................',
      '==========__====',
      '................', '................', '................',
      '===__===========',
      '................', '................', '................',
      '==========__====',
      '................', '................', '................',
      '================'
    ],
    ladders: [[14, 15, 19], [1, 11, 15], [13, 7, 11], [1, 3, 7]],
    items: [['girder', 5, 19], ['girder', 5, 15], ['girder', 8, 11], ['girder', 6, 7], ['hammer', 12, 3]],
    enemies: [['vandal', 11, 6, 12, 0.45], ['inspector', 7, 2, 8, 0.4]],
    bolts: 130
  },
  {
    name: 'Lunch Break',
    goal: 'Collect all 6 lunchboxes. Ride the lift on the right and mind the conveyor belts.',
    map: [
      '................', '................', '................',
      '======....====..',
      '................', '................', '................',
      '====<<<<<<<<==..',
      '................', '................', '................',
      '====>>>>>>>>==..',
      '................', '................', '................',
      '==============..',
      '................', '................', '................',
      '^==============='
    ],
    ladders: [[2, 15, 19], [12, 11, 15], [2, 7, 11], [12, 3, 7]],
    items: [['lunch', 10, 19], ['lunch', 7, 15], ['lunch', 7, 11], ['lunch', 0, 7], ['lunch', 8, 7], ['lunch', 1, 3]],
    enemies: [['vandal', 15, 4, 11, 0.45], ['inspector', 3, 0, 4, 0.3]],
    platforms: [
      { type: 'elev', x: 224, w: 32, stops: [304, 240, 176, 112, 48], speed: 0.5 },
      { type: 'mover', y: 48, w: 32, x0: 96, x1: 128, speed: 0.35 }
    ],
    bolts: 0
  },
  {
    name: 'Box Plant',
    goal: 'Carry the 5 crates, one at a time, to the hopper in the middle. Time the stamper.',
    map: [
      '................', '................', '................',
      '================',
      '................', '................', '................',
      '=====......=====',
      '................', '................', '................',
      '>>>>>>====<<<<<<',
      '................', '................', '................',
      '=======..=======',
      '................', '................', '................',
      '^==============='
    ],
    ladders: [[1, 15, 19], [14, 11, 15], [1, 7, 11], [14, 3, 7]],
    items: [['box', 12, 19], ['box', 5, 15], ['box', 13, 11], ['box', 13, 7], ['box', 8, 3]],
    enemies: [['vandal', 3, 4, 12, 0.45], ['inspector', 19, 7, 14, 0.4]],
    platforms: [{ type: 'mover', y: 112, w: 32, x0: 80, x1: 144, speed: 0.4 }],
    hopper: { row: 11, x0: 108, x1: 148 },
    stamper: { row: 15, c0: 10, c1: 11, period: 170 },
    bolts: 0
  }
];

function newGame(hi) {
  const g = { score: 0, hi: hi || 0, lives: 3, loop: 0, li: 0, mode: 'title', ev: [], pops: [], seed: 12345, nextLife: 10000, tick: 0, noEnemies: false };
  return g;
}
function rnd(g) { g.seed = (g.seed * 1103515245 + 12345) & 0x7fffffff; return g.seed / 0x7fffffff; }

function loadLevel(g) {
  const L = LEVELS[g.li];
  g.L = L;
  g.tiles = L.map.map(r => r.split(''));
  g.slots = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (g.tiles[r][c] === '_' && (c === 0 || g.tiles[r][c - 1] !== '_')) {
        let c1 = c; while (c1 + 1 < COLS && g.tiles[r][c1 + 1] === '_') c1++;
        g.slots.push({ row: r, c0: c, c1: c1, state: 0 });
      }
    }
  }
  g.items = L.items.map(a => ({ kind: a[0], x: a[1] * T + 8, y: a[2] * T, taken: false }));
  g.deposited = 0;
  g.bonus = 3000;
  g.hammer = false;
  g.stamp = L.stamper ? Object.assign({ t: 0, down: false }, L.stamper) : null;
  g.clearT = 0;
  resetActors(g);
}

function resetActors(g) {
  const L = g.L, sp = 1 + 0.15 * g.loop;
  g.p = { x: 24, y: 19 * T, vy: 0, face: 1, ground: true, lad: null, ride: null, carry: null, carryItem: null, dead: false, deadT: 0, minY: 19 * T, anim: 0, jbuf: 0, moving: false };
  g.enemies = g.noEnemies ? [] : L.enemies.map(a => ({ type: a[0], y: a[1] * T, x0: a[2] * T + 8, x1: a[3] * T + 8, x: a[3] * T + 8, dir: -1, speed: a[4] * sp, jumped: false }));
  g.plats = (L.platforms || []).map(d => {
    if (d.type === 'elev') return { type: 'elev', x: d.x, w: d.w, y: d.stops[0], stops: d.stops, i: 0, dir: 1, pause: 60, speed: d.speed, vx: 0, vy: 0 };
    return { type: 'mover', x: d.x0, y: d.y, w: d.w, x0: d.x0, x1: d.x1, dir: 1, pause: 30, speed: d.speed, vx: 0, vy: 0 };
  });
  g.bolts = [];
  g.boltT = 90;
  g.prevJump = false;
}

function startGame(g) {
  g.score = 0; g.lives = 3; g.loop = 0; g.li = 0; g.nextLife = 10000;
  loadLevel(g); g.mode = 'intro';
}

function tileAt(g, c, r) { return (r < 0 || r >= ROWS || c < 0 || c >= COLS) ? '.' : g.tiles[r][c]; }
function solidAt(g, x, r) { return SOLID.indexOf(tileAt(g, Math.floor(x / T), r)) >= 0; }
function addScore(g, n, x, y) {
  g.score += n;
  if (x !== undefined) g.pops.push({ x: x, y: y, txt: String(n), t: 50 });
  if (g.score >= g.nextLife) { g.nextLife += 10000; g.lives++; g.ev.push('life'); }
  if (g.score > g.hi) g.hi = g.score;
}

function supportAt(g, x, y, ride) {
  const order = ride ? [ride].concat(g.plats.filter(q => q !== ride)) : g.plats;
  for (const q of order) {
    if (Math.abs(q.y - y) <= 3 && x >= q.x - 1 && x <= q.x + q.w + 1) return { y: q.y, plat: q };
  }
  const r = Math.round(y / T);
  if (Math.abs(r * T - y) <= 3 && solidAt(g, x, r)) return { y: r * T, plat: null };
  return null;
}

function ladderAt(g, x, y, dir) {
  for (const L of g.L.ladders) {
    const cx = L[0] * T + 8, top = L[1] * T, bot = L[2] * T;
    if (Math.abs(x - cx) > 6) continue;
    if (dir < 0 && y > top && y <= bot + 1) return L;
    if (dir > 0 && y >= top - 1 && y < bot) return L;
  }
  return null;
}

function die(g, why) {
  const p = g.p;
  if (p.dead) return;
  p.dead = true; p.deadT = 100; p.why = why; p.vy = -2;
  g.ev.push('die');
}

function stepPlatforms(g) {
  for (const q of g.plats) {
    q.vx = 0; q.vy = 0;
    if (q.type === 'elev') {
      if (q.pause > 0) { q.pause--; continue; }
      let ni = q.i + q.dir;
      if (ni < 0 || ni >= q.stops.length) { q.dir = -q.dir; ni = q.i + q.dir; }
      const ty = q.stops[ni], d = ty - q.y;
      const mv = Math.sign(d) * Math.min(Math.abs(d), q.speed);
      q.y += mv; q.vy = mv;
      if (q.y === ty) { q.i = ni; q.pause = 80; }
    } else {
      if (q.pause > 0) { q.pause--; continue; }
      const nx = Math.max(q.x0, Math.min(q.x1, q.x + q.dir * q.speed));
      q.vx = nx - q.x; q.x = nx;
      if (q.x >= q.x1) { q.dir = -1; q.pause = 55; }
      else if (q.x <= q.x0) { q.dir = 1; q.pause = 55; }
    }
  }
}

function land(g, y, plat) {
  const p = g.p;
  const ch = plat ? '' : tileAt(g, Math.floor(p.x / T), Math.round(y / T));
  p.y = y;
  if (ch === '^') { p.vy = SPRINGV; p.minY = y; p.ground = false; p.ride = null; g.ev.push('spring'); return; }
  if (y - p.minY > MAXFALL) { p.ground = true; p.vy = 0; die(g, 'fall'); return; }
  p.ground = true; p.vy = 0; p.ride = plat;
  for (const e of g.enemies) e.jumped = false;
  if (p.jbuf > 0) doJump(g);
}
function doJump(g) {
  const p = g.p;
  p.vy = JUMP; p.ground = false; p.ride = null; p.minY = p.y; p.jbuf = 0;
  g.ev.push('jump');
}

function stepPlayer(g, inp) {
  const p = g.p;
  const jp = inp.jump && !g.prevJump;
  g.prevJump = !!inp.jump;
  if (jp) p.jbuf = 7; else if (p.jbuf > 0) p.jbuf--;
  p.moving = false;

  if (p.lad) {
    const top = p.lad[1] * T, bot = p.lad[2] * T;
    if (inp.up) { p.y -= CLIMB; p.moving = true; }
    else if (inp.down) { p.y += CLIMB; p.moving = true; }
    if (p.y <= top) { p.y = top; p.lad = null; p.ground = true; }
    else if (p.y >= bot) { p.y = bot; p.lad = null; p.ground = true; }
    if (p.moving) p.anim++;
    return;
  }

  let vx = 0;
  if (inp.left) vx = -WALK; else if (inp.right) vx = WALK;
  if (vx) { p.face = vx < 0 ? -1 : 1; p.moving = true; p.anim++; }

  if (p.ground) {
    if (inp.up || inp.down) {
      const L = ladderAt(g, p.x, p.y, inp.up ? -1 : 1);
      if (L) { p.lad = L; p.x = L[0] * T + 8; p.ground = false; p.ride = null; p.vy = 0; p.y += inp.up ? -CLIMB : CLIMB; return; }
    }
    if (p.ride) { p.x += p.ride.vx; p.y = p.ride.y; }
    else {
      const ch = tileAt(g, Math.floor(p.x / T), Math.round(p.y / T));
      if (ch === '>') vx += CONV; else if (ch === '<') vx -= CONV;
    }
    p.x = Math.max(5, Math.min(W - 5, p.x + vx));
    if (p.jbuf > 0) { doJump(g); return; }
    const s = supportAt(g, p.x, p.y, p.ride);
    if (!s) { p.ground = false; p.ride = null; p.vy = 0; p.minY = p.y; }
    else {
      p.y = s.y; p.ride = s.plat;
      if (!s.plat && tileAt(g, Math.floor(p.x / T), Math.round(p.y / T)) === '^') {
        p.vy = SPRINGV; p.ground = false; p.minY = p.y; g.ev.push('spring');
      }
    }
  } else {
    const py = p.y;
    p.vy = Math.min(p.vy + GRAV, 4);
    p.y += p.vy;
    p.x = Math.max(5, Math.min(W - 5, p.x + vx));
    if (p.y < p.minY) p.minY = p.y;
    if (p.vy >= 0) {
      for (const q of g.plats) {
        if (py <= q.y - q.vy + 2 && p.y >= q.y && p.x >= q.x - 2 && p.x <= q.x + q.w + 2) { land(g, q.y, q); return; }
      }
      for (let r = Math.ceil(py / T); r * T <= p.y; r++) {
        if (solidAt(g, p.x, r)) { land(g, r * T, null); return; }
      }
    }
    if (p.y > H + 24) die(g, 'fall');
  }
}

function stepItems(g) {
  const p = g.p;
  for (const it of g.items) {
    if (it.taken) continue;
    if (Math.abs(p.x - it.x) < 9 && Math.abs(p.y - it.y) < 10) {
      if (it.kind === 'girder' || it.kind === 'box') {
        if (p.carry) continue;
        it.taken = true; p.carry = it.kind; p.carryItem = it; addScore(g, 100, it.x, it.y - 18); g.ev.push('pick');
      } else if (it.kind === 'hammer') {
        it.taken = true; g.hammer = true; addScore(g, 250, it.x, it.y - 18); g.ev.push('power');
      } else if (it.kind === 'lunch') {
        it.taken = true; addScore(g, 250, it.x, it.y - 18); g.ev.push('pick');
      }
    }
  }
  if (!p.ground) return;
  for (const s of g.slots) {
    if (p.y !== s.row * T) continue;
    const xl = s.c0 * T, xr = (s.c1 + 1) * T;
    if (s.state === 0 && p.carry === 'girder' && ((p.x >= xl - 11 && p.x <= xl) || (p.x >= xr && p.x <= xr + 11))) {
      s.state = 1; p.carry = null; p.carryItem = null;
      for (let c = s.c0; c <= s.c1; c++) g.tiles[s.row][c] = 'g';
      addScore(g, 200, (xl + xr) / 2, s.row * T - 18); g.ev.push('place');
    } else if (s.state === 1 && g.hammer && p.x >= xl + 3 && p.x <= xr - 3) {
      s.state = 2; s.fx = 30;
      for (let c = s.c0; c <= s.c1; c++) g.tiles[s.row][c] = 'G';
      addScore(g, 300, (xl + xr) / 2, s.row * T - 18); g.ev.push('rivet');
    }
  }
  const hp = g.L.hopper;
  if (hp && p.carry === 'box' && p.y === hp.row * T && p.x >= hp.x0 && p.x <= hp.x1) {
    p.carry = null; p.carryItem = null; g.deposited++; g.hopFx = 30;
    addScore(g, 400, p.x, p.y - 22); g.ev.push('place');
  }
}

function levelDone(g) {
  const k = g.li;
  if (k === 0) return g.slots.every(s => s.state === 2);
  if (k === 1) return g.items.every(i => i.taken);
  return g.deposited >= g.items.length;
}
function remaining(g) {
  const k = g.li;
  if (k === 0) return g.slots.filter(s => s.state !== 2).length;
  if (k === 1) return g.items.filter(i => !i.taken).length;
  return g.items.length - g.deposited;
}

function stepHazards(g) {
  const p = g.p;
  for (const e of g.enemies) {
    e.x += e.dir * e.speed;
    if (e.x <= e.x0) { e.x = e.x0; e.dir = 1; }
    if (e.x >= e.x1) { e.x = e.x1; e.dir = -1; }
    const dx = Math.abs(p.x - e.x);
    if (dx < 7 && p.y > e.y - 13 && p.y - 14 < e.y) die(g, e.type);
    else if (!p.ground && !p.lad && dx < 6 && p.y <= e.y - 13 && p.y > e.y - 40 && !e.jumped) { e.jumped = true; addScore(g, 100, e.x, e.y - 30); g.ev.push('bonus'); }
  }
  const every = g.L.bolts ? g.L.bolts : (g.loop > 0 ? 200 : 0);
  if (every && !g.noEnemies) {

    for (const k of ['left', 'right', 'up', 'down']) { inp[k] = k === d; arrows[k].classList.toggle('on', k === d); }
  }
  function padMove(e) {
    const r = dpad.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < 0.16 && ay < 0.16) { setDir(''); axis = ''; return; }
    if (axis === 'x' ? ay > ax * 1.3 : axis === 'y' ? ax > ay * 1.3 : true) axis = ax >= ay ? 'x' : 'y';
    setDir(axis === 'x' ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'));
  }
  dpad.addEventListener('pointerdown', e => { e.preventDefault(); audio(); padId = e.pointerId; try { dpad.setPointerCapture(padId); } catch (x) { /* fine */ } padMove(e); });
  dpad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
  const padUp = e => { if (e.pointerId === padId) { padId = null; axis = ''; setDir(''); } };
  dpad.addEventListener('pointerup', padUp); dpad.addEventListener('pointercancel', padUp);

  const jb = $('jump');
  let jumpIds = new Set();
  function jumpDown(e) { e.preventDefault(); audio(); jumpIds.add(e.pointerId); inp.jump = true; jb.classList.add('on'); }
  function jumpUp(e) { jumpIds.delete(e.pointerId); if (!jumpIds.size) { inp.jump = false; jb.classList.remove('on'); } }
  jb.addEventListener('pointerdown', jumpDown); cv.addEventListener('pointerdown', jumpDown);
  window.addEventListener('pointerup', jumpUp); window.addEventListener('pointercancel', jumpUp);
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());

  /* ---- keyboard ---- */
  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', ' ': 'jump', z: 'jump', x: 'jump' };
  window.addEventListener('keydown', e => {
    const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (k) { inp[k] = true; e.preventDefault(); audio(); }
    if (e.key === 'Enter' && shown) { advance(); e.preventDefault(); }
    if ((e.key === 'p' || e.key === 'Escape') && !e.repeat) setPause(!paused);
  });
  window.addEventListener('keyup', e => { const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (k) inp[k] = false; });

  $('btnPause').addEventListener('click', () => { audio(); setPause(!paused); });
  const bs = $('btnSound');
  function soundLabel() { bs.textContent = sound ? 'SND ON' : 'SND OFF'; bs.setAttribute('aria-pressed', String(sound)); }
  bs.addEventListener('click', () => { sound = !sound; store.set('hhm-sound', sound ? '1' : '0'); soundLabel(); audio(); if (sound) SFX.bonus(); });
  soundLabel();

  /* ---- full screen, where the browser allows it (not on iPhone) ---- */
  const bf = $('btnFull'), root = document.documentElement;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const canFs = !!((document.fullscreenEnabled && root.requestFullscreen) || (document.webkitFullscreenEnabled && root.webkitRequestFullscreen));
  bf.hidden = !canFs;
  function fullLabel() { bf.textContent = fsEl() ? 'EXIT' : 'FULL'; }
  bf.addEventListener('click', () => {
    audio();
    try {
      const p = fsEl() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
                       : (root.requestFullscreen || root.webkitRequestFullscreen).call(root, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => { bf.hidden = true; });
    } catch (e) { bf.hidden = true; }
  });
  document.addEventListener('fullscreenchange', () => { fullLabel(); fit(); });
  document.addEventListener('webkitfullscreenchange', () => { fullLabel(); fit(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); else if (lock === null && g.mode === 'play') wake(); });

  /* ---- loop ---- */
  let last = 0, acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(100, now - (last || now)); last = now;
    if (!paused) {
      acc += dt;
      let n = 0;
      while (acc >= 1000 / 60 && n < 5) { step(g, inp); acc -= 1000 / 60; n++; }
      if (n === 5) acc = 0;
    }
    if (g.ev.length) {
      for (const e of g.ev) { if (SFX[e]) SFX[e](); if (e === 'die') { try { if (navigator.vibrate) navigator.vibrate(80); } catch (x) { /* no haptics */ } } }
      g.ev.length = 0;
    }
    if (!paused) { if (g.mode === 'intro') show('intro'); else if (g.mode === 'over') show('over'); else if (g.mode === 'title') show('title'); else show(''); }
    draw(g, ctx); hud();
  }

  try { document.fonts && document.fonts.load('11px Silkscreen'); } catch (e) { /* fallback font is fine */ }
  function start(data) {
    if (data && data.live) { g.score = data.score | 0; g.lives = data.lives | 0; g.li = data.li | 0; g.loop = data.loop | 0; g.nextLife = (Math.floor(g.score / 10000) + 1) * 10000; loadLevel(g); g.mode = 'intro'; }
    fit(); show(g.mode === 'intro' ? 'intro' : 'title'); requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ live: g.mode === 'play' || g.mode === 'intro' || g.mode === 'clear', score: g.score, lives: g.lives, li: g.li, loop: g.loop }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
  window.__hhm = g;
})();
</script>
